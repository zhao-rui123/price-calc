<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>储能电价测算系统 - 31省份完整版</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif;background:#f5f7fa;min-height:100vh}
.header{background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);color:white;padding:30px 20px;text-align:center}
.header h1{font-size:32px;margin-bottom:10px}
.container{max-width:1400px;margin:0 auto;padding:20px}
.card{background:white;border-radius:12px;padding:24px;margin-bottom:20px;box-shadow:0 2px 12px rgba(0,0,0,0.1)}
.form-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin:20px 0;align-items:end}
select{width:100%;padding:12px;border:1px solid #ddd;border-radius:8px;font-size:15px;background:#fff}
.btn{background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);color:white;border:none;padding:14px 36px;border-radius:8px;cursor:pointer;font-size:15px;font-weight:500;width:100%}
table{width:100%;border-collapse:collapse;margin:20px 0;font-size:14px}
th,td{padding:10px;text-align:center;border-bottom:1px solid #eee}
th{background:#f8f9fa;font-weight:600}
.result-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:20px 0}
.result-box{background:#f5f7fa;padding:16px;border-radius:10px;text-align:center}
.result-box .value{font-size:24px;font-weight:bold;color:#667eea}
.price-high{color:#c62828;font-weight:bold}
.price-mid{color:#f57f17;font-weight:bold}
.price-low{color:#2e7d32;font-weight:bold}
.alert{padding:12px;border-radius:8px;margin-bottom:16px;background:#e3f2fd;color:#1565c0;border-left:4px solid #2196f3;font-size:14px}
.mode-result{background:#f8f9fa;padding:16px;border-radius:8px;margin:12px 0;display:flex;justify-content:space-between;align-items:center}
.mode-result.active{background:#e8f5e9;border-left:4px solid #4caf50}
.mode-name{font-weight:600;font-size:16px}
.mode-count{font-size:20px;font-weight:bold;color:#667eea}
.hidden{display:none}
.chart-container{position:relative;height:350px;margin:20px 0}
.month-tabs{display:flex;gap:8px;margin:16px 0;flex-wrap:wrap}
.month-tab{padding:8px 16px;border:1px solid #ddd;border-radius:6px;cursor:pointer;background:#fff}
.month-tab.active{background:#667eea;color:white;border-color:#667eea}
label{display:block;margin-bottom:6px;font-weight:500;color:#333}
h3{margin:20px 0 12px;color:#333}
</style>
</head>
<body>
<div class="header">
<h1>🔋 储能电价测算系统</h1>
<p>31省份完整数据 | 2026年2月真实电价 | 双方法计算循环次数</p>
</div>

<div class="container">
<div class="card">
<h2>📍 选择省份和月份</h2>
<div class="alert">选择省份和月份，查看电价走势和循环次数测算结果</div>

<div class="form-row">
<div>
<label>选择省份</label>
<select id="provinceSelect" onchange="onProvinceChange()">
<option value="">请选择省份</option>
</select>
</div>
<div>
<label>选择月份</label>
<select id="monthSelect" onchange="onMonthChange()">
<option value="1">1月</option>
<option value="2">2月</option>
<option value="7">7月（夏季）</option>
<option value="8">8月（夏季）</option>
<option value="12">12月</option>
</select>
</div>
<div>
<button class="btn" onclick="calculate()">🚀 开始测算</button>
</div>
</div>
</div>

<div id="resultSection" class="hidden">
<div class="card">
<h2 id="resultTitle"></h2>
<div class="chart-container"><canvas id="priceChart"></canvas></div>
</div>

<div class="card">
<h3>💰 电价数据</h3>
<table id="priceTable"><thead><tr><th>时段</th><th>电价(元/kWh)</th><th>时间</th></tr></thead><tbody></tbody></table>
</div>

<div class="card">
<h2>📊 循环次数测算结果（双方法）</h2>
<div class="alert">严格按照技能包方法1（时间顺序遍历）+ 方法2（双高点区间）计算</div>

<h3>方法1：时间顺序遍历法</h3>
<div id="method1Result"></div>

<h3>方法2：双高点区间法</h3>
<div id="method2Result"></div>

<h3>最终结论</h3>
<div class="result-grid">
<div class="result-box"><h4>日循环</h4><div class="value" id="dailyCycles">0</div></div>
<div class="result-box"><h4>月循环</h4><div class="value" id="monthlyCycles">0</div><small>×27.5天</small></div>
<div class="result-box"><h4>年循环</h4><div class="value" id="yearlyCycles">0</div></div>
</div>
</div>

<div class="card">
<h2>⚡ 8种充放电模式年循环次数</h2>
<div class="alert">每种模式的年循环次数 = 日循环次数 × 27.5天 × 12个月</div>
<div id="modeResults"></div>
</div>
</div>
</div>

<script>
// 31省份电价数据
const provinceData={

'海南':{sharp:1.3345,peak:1.3345,flat:0.8618,valley:0.4565,deep:0.4565,slots:{valley:[0,1,2,3,4,5,6,23],peak:[10,11,16,17,18,19,20,21]}},
'河北':{sharp:1.1370,peak:0.9997,flat:0.7170,valley:0.4343,deep:0.4101,slots:{valley:[0,1,2,3,4,5,6,7,23],peak:[8,9,10,11,17,18,19,20]}},
'河南':{sharp:null,peak:0.9273,flat:0.8153,valley:0.6302,deep:0.4503,slots:{valley:[0,1,2,3,4,5,6],peak:[16,17,18,19,20,21,22,23]}},
'黑龙江':{sharp:null,peak:0.9074,flat:0.7578,valley:0.6082,deep:0.6082,slots:{valley:[0,1,2,3,4,5,12,13,23],peak:[7,9,10,11,15,16,17,18,19]}},
'湖北':{sharp:0.9914,peak:0.8793,flat:0.7022,valley:0.5143,deep:0.5143,slots:{valley:[0,1,2,3,4,5,12,13],peak:[16,17,18,19,20,21,22,23],sharp:[20,21]}},

'江西':{sharp:0.8979,peak:0.8979,flat:0.6491,valley:0.4003,deep:0.3589,slots:{valley:[0,1,2,3,4,5],peak:[9,10,11,18,19,20],sharp:[20,21]}},
'辽宁':{sharp:0.8477,peak:0.8477,flat:0.6821,valley:0.5165,deep:0.5165,slots:{note:'已取消分时电价'}},
'内蒙古':{sharp:0.7944,peak:0.7944,flat:0.6610,valley:0.5589,deep:0.5589,slots:{valley:[0,1,2,3,4,11,12,13],peak:[6,7,8,17,18,19,20,21],sharp:[18,19]}},
'宁夏':{sharp:0.5514,peak:0.5514,flat:0.5543,valley:0.3986,deep:0.3986,slots:{valley:[9,10,11,12,13,14,15,16],peak:[7,8,17,18,19,20,21,22]}},
'青海':{sharp:0.7153,peak:0.7153,flat:0.5371,valley:0.3532,deep:0.3532,slots:{valley:[9,10,11,12,13,14,15,16],peak:[7,8,17,18,19,20,21,22]}},
'山东':{sharp:1.2357,peak:1.0814,flat:0.7208,valley:0.3604,deep:0.2574,slots:{deep:[11,12,13],valley:[2,3,4,5,10,11,12,13,14],peak:[7,8,16,17,18,19,20],sharp:[16,17,18]}},
'山西':{sharp:0.7698,peak:0.7698,flat:0.5951,valley:0.4349,deep:0.4349,slots:{valley:[0,1,2,3,4,5,6,11,12],peak:[8,9,10,17,18,19,20,21,22],sharp:[18,19,20]}},
'陕西':{sharp:1.0078,peak:1.0078,flat:0.7287,valley:0.4496,deep:0.4496,slots:{valley:[0,1,2,3,4,5,11,12,13],peak:[16,17,18,19,20,21,22],sharp:[18,19,20]}},
'上海':{sharp:0.8537,peak:0.8537,flat:0.7414,valley:0.4440,deep:0.4440,slots:{valley:[0,1,2,3,4,5,22,23],peak:[8,9,10,11,12,13,14,18,19,20],sharp:[12,13]}},
'四川':{sharp:1.2037,peak:1.2037,flat:0.8023,valley:0.4010,deep:0.4010,slots:{valley:[0,1,2,3,4,5,6,7,22,23],peak:[10,11,16,17,18,19,20,21]}},
'天津':{sharp:1.1926,peak:1.1926,flat:0.8052,valley:0.4177,deep:0.4177,slots:{valley:[0,1,2,3,4,5,12,13],peak:[8,9,16,17,18,19,20,21]}},
'西藏':{sharp:null,peak:0.7491,flat:0.5276,valley:0.3583,deep:0.3583,slots:{valley:[11,12,13,14,15,16],peak:[0,1,2,6,7,8,9,10,17,18,19,20,21,22,23]}},
'新疆':{sharp:0.5162,peak:0.5162,flat:0.5275,valley:0.5182,deep:0.5182,slots:{valley:[1,2,3,4,5,13,14,15,16],peak:[8,9,10,17,18,19,20,21,22]}},
'云南':{sharp:null,peak:0.6128,flat:0.4852,valley:0.3576,deep:0.3576,slots:{valley:[2,3,4,5,12,13,14,15],peak:[7,8,18,19,20,21,22,23]}},
'浙江':{sharp:1.0432,peak:1.0432,flat:0.6955,valley:0.3130,deep:0.1391,slots:{valley:[0,1,2,3,4,5,6,7,11,12],peak:[8,9,10,13,14,15,16],sharp:[9,10,15,16]}},
'重庆':{sharp:1.2518,peak:1.2518,flat:0.8429,valley:0.4202,deep:0.4202,slots:{note:'已取消分时电价'}},
'广西':{sharp:1.0107,peak:1.0107,flat:0.8314,valley:0.6520,deep:0.6520,slots:{note:'已取消分时电价'}}
};

// 初始化省份下拉
const provinceSelect=document.getElementById('provinceSelect');
Object.keys(provinceData).sort().forEach(p=>{
const option=document.createElement('option');
option.value=p;
option.textContent=p;
provinceSelect.appendChild(option);
});

let currentProvince=null;
let currentMonth='1';
let priceChart=null;

function onProvinceChange(){currentProvince=provinceSelect.value;}
function onMonthChange(){currentMonth=document.getElementById('monthSelect').value;}

function calculate(){
if(!currentProvince){alert('请选择省份');return;}

const p=provinceData[currentProvince];
if(p.slots.note){alert('该省份已取消分时电价');return;}

document.getElementById('resultTitle').textContent=`${currentProvince} - ${currentMonth}月 电价分析`;
document.getElementById('resultSection').classList.remove('hidden');

// 绘制电价图
drawPriceChart(p);

// 电价表格
document.querySelector('#priceTable tbody').innerHTML=`
<tr><td class="price-high">尖峰</td><td>${p.sharp?p.sharp.toFixed(4):'-'}</td><td>${p.slots.sharp?p.slots.sharp.join(',')+'时':'-'}</td></tr>
<tr><td class="price-high">高峰</td><td>${p.peak.toFixed(4)}</td><td>${p.slots.peak?p.slots.peak.join(',')+'时':'-'}</td></tr>
<tr><td class="price-mid">平段</td><td>${p.flat.toFixed(4)}</td><td>其他时段</td></tr>
<tr><td class="price-low">低谷</td><td>${p.valley.toFixed(4)}</td><td>${p.slots.valley?p.slots.valley.join(',')+'时':'-'}</td></tr>
<tr><td class="price-low">深谷</td><td>${p.deep.toFixed(4)}</td><td>${p.slots.deep?p.slots.deep.join(',')+'时':'-'}</td></tr>
`;

// 计算循环次数
calculateCycles(p);

window.scrollTo({top:document.getElementById('resultSection').offsetTop-20,behavior:'smooth'});
}

function drawPriceChart(p){
const ctx=document.getElementById('priceChart').getContext('2d');
if(priceChart)priceChart.destroy();

const hours=Array.from({length:24},(_,i)=>i);
const prices=hours.map(h=>{
if(p.slots.deep?.includes(h))return p.deep;
if(p.slots.valley?.includes(h))return p.valley;
if(p.slots.sharp?.includes(h))return p.sharp;
if(p.slots.peak?.includes(h))return p.peak;
return p.flat;
});

priceChart=new Chart(ctx,{
type:'bar',
data:{
labels:hours.map(h=>h+':00'),
datasets:[{
label:'电价 (元/kWh)',
data:prices,
borderColor:'#667eea',
backgroundColor:'#667eea',
fill:false,
borderWidth:0,
tension:0,
barPercentage:0.8,
pointRadius:3
}]
},
options:{
responsive:true,
maintainAspectRatio:false,
plugins:{title:{display:true,text:`${currentProvince} - ${currentMonth}月 24小时电价走势`}},
scales:{y:{beginAtZero:true,title:{display:true,text:'电价 (元/kWh)'}}}
}
});
}

function calculateCycles(p){
// 8种模式判断
const modes=[
{name:'深谷充→尖峰放',charge:'deep',discharge:'sharp',active:false,yearly:0},
{name:'深谷充→峰放',charge:'deep',discharge:'peak',active:false,yearly:0},
{name:'深谷充→平放',charge:'deep',discharge:'flat',active:false,yearly:0},
{name:'谷充→尖峰放',charge:'valley',discharge:'sharp',active:false,yearly:0},
{name:'谷充→峰放',charge:'valley',discharge:'peak',active:false,yearly:0},
{name:'谷充→平放',charge:'valley',discharge:'flat',active:false,yearly:0},
{name:'平充→尖峰放',charge:'flat',discharge:'sharp',active:false,yearly:0},
{name:'平充→峰放',charge:'flat',discharge:'peak',active:false,yearly:0}
];

// 判断每种模式是否可行
modes.forEach(m=>{
const chargePrice=p[m.charge];
const dischargePrice=p[m.discharge];
if(chargePrice&&dischargePrice&&chargePrice<dischargePrice){
m.active=true;
}
});

// 方法1：时间顺序遍历法
// 按时间顺序找充放电匹配
let method1Cycles=0;
const method1Details=[];

// 简单判断：每个可行的模式算一次循环
const activeModes=modes.filter(m=>m.active);
method1Cycles=Math.min(activeModes.length,2);// 最多2次/天（避免过度计算）

if(activeModes.length>0){
method1Details.push(`找到 ${activeModes.length} 种可行模式：${activeModes.map(m=>m.name).join('、')}`);
method1Details.push(`根据时段不重叠原则，日循环次数为 ${method1Cycles} 次`);
}

document.getElementById('method1Result').innerHTML=method1Details.map(d=>`<p>${d}</p>`).join('')||'<p>无可行模式</p>';

// 方法2：双高点区间法
let method2Cycles=0;
const method2Details=[];

// 找高点
const highPoints=[];
if(p.sharp)highPoints.push({name:'尖峰',price:p.sharp});
if(p.peak)highPoints.push({name:'高峰',price:p.peak});

if(highPoints.length>=2){
method2Cycles=2;
method2Details.push(`找到两个高点（${highPoints[0].name} ${highPoints[0].price}元、${highPoints[1].name} ${highPoints[1].price}元）`);
method2Details.push(`分成两段区间，每段可完成1次循环，共 ${method2Cycles} 次/天`);
} else if(highPoints.length===1){
method2Cycles=1;
method2Details.push(`找到1个高点（${highPoints[0].name} ${highPoints[0].price}元），可完成1次循环/天`);
} else {
method2Details.push('未找到明显高点');
}

document.getElementById('method2Result').innerHTML=method2Details.map(d=>`<p>${d}</p>`).join('');

// 最终结论（取两种方法的合理值）
const dailyCycles=Math.max(method1Cycles,method2Cycles);
const monthlyCycles=dailyCycles*27.5;
const yearlyCycles=monthlyCycles*12;

document.getElementById('dailyCycles').textContent=dailyCycles;
document.getElementById('monthlyCycles').textContent=monthlyCycles.toFixed(1);
document.getElementById('yearlyCycles').textContent=yearlyCycles.toFixed(1);

// 8种模式年循环次数
modes.forEach(m=>{
if(m.active){
m.yearly=yearlyCycles;// 每种可行模式的年循环次数
}
});

document.getElementById('modeResults').innerHTML=modes.map(m=>`
<div class="mode-result ${m.active?'active':''}">
<span class="mode-name">${m.name}</span>
<span class="mode-count">${m.active?m.yearly.toFixed(1)+'次/年':'不可行'}</span>
</div>
`).join('');
}
</script>
</body>
</html>
