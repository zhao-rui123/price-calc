<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>储能电价测算系统 - 安徽全年通算</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif;background:#f5f7fa;min-height:100vh}
.header{background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);color:white;padding:30px 20px;text-align:center}
.header h1{font-size:32px;margin-bottom:10px}
.container{max-width:1400px;margin:0 auto;padding:20px}
.card{background:white;border-radius:12px;padding:24px;margin-bottom:20px;box-shadow:0 2px 12px rgba(0,0,0,0.1)}
.result-box{background:#f5f7fa;padding:20px;border-radius:10px;text-align:center;margin:15px 0}
.result-box .value{font-size:32px;font-weight:bold;color:#667eea}
.month-row{display:grid;grid-template-columns:80px 1fr 100px 100px;gap:10px;padding:10px;border-bottom:1px solid #eee;align-items:center}
.month-row.header{background:#f8f9fa;font-weight:600}
.total-row{background:#e3f2fd;font-weight:bold}
.mode-box{background:#e8f5e9;padding:16px;border-radius:8px;margin:10px 0;display:flex;justify-content:space-between;align-items:center}
.mode-box .count{font-size:24px;font-weight:bold;color:#667eea}
h2{color:#333;border-bottom:2px solid #667eea;padding-bottom:10px;margin-bottom:20px}
h3{margin:20px 0 12px;color:#333}
</style>
</head>
<body>
<div class="header">
<h1>🔋 储能电价测算系统</h1>
<p>安徽全年通算 | 各月循环次数累加</p>
</div>

<div class="container">
<div class="card">
<h2>📊 安徽全年循环次数测算</h2>

<h3>各月明细（日循环×27.5天）</h3>
<div style="border:1px solid #ddd;border-radius:8px;overflow:hidden">
<div class="month-row header">
<div>月份</div><div>时段安排</div><div>日循环</div><div>月循环</div>
</div>
<div id="monthList"></div>
<div class="month-row total-row">
<div>全年</div><div></div><div>-</div><div id="totalCycles">0</div>
</div>
</div>

<h3>全年统计</h3>
<div class="result-box">
<div style="font-size:18px;margin-bottom:10px">全年总循环次数</div>
<div class="value" id="yearlyTotal">0</div><div>次/年</div>
</div>

<h3>各模式全年循环次数</h3>
<div id="modeResults"></div>
</div>
</div>

<script>
// 安徽2026年2月电价
const price={sharp:null,peak:1.0235,flat:0.6380,valley:0.3161,deep:0.3161};

// 安徽12个月数据
const monthData=[
{month:'1月',desc:'低谷0-8时，高峰15-23时',daily:1,type:'谷-峰'},
{month:'2月',desc:'低谷0-8时，高峰15-23时',daily:1,type:'谷-峰'},
{month:'3月',desc:'低谷0-6时，平段6-16时，高峰16-23时',daily:2,type:'谷-峰+平-峰'},
{month:'4月',desc:'低谷0-6时，平段6-16时，高峰16-23时',daily:2,type:'谷-峰+平-峰'},
{month:'5月',desc:'低谷0-6时，平段6-16时，高峰16-23时',daily:2,type:'谷-峰+平-峰'},
{month:'6月',desc:'低谷0-6时，平段6-16时，高峰16-23时',daily:2,type:'谷-峰+平-峰'},
{month:'7月',desc:'低谷0-8时，高峰16-24时',daily:1,type:'谷-峰'},
{month:'8月',desc:'低谷0-8时，高峰16-24时',daily:1,type:'谷-峰'},
{month:'9月',desc:'低谷0-8时，高峰16-24时',daily:1,type:'谷-峰'},
{month:'10月',desc:'低谷0-6时，平段6-16时，高峰16-23时',daily:2,type:'谷-峰+平-峰'},
{month:'11月',desc:'低谷0-6时，平段6-16时，高峰16-23时',daily:2,type:'谷-峰+平-峰'},
{month:'12月',desc:'低谷0-8时，高峰15-23时',daily:1,type:'谷-峰'}
];

// 计算各月循环
let totalCycles=0;
let guFengCycles=0;
let pingFengCycles=0;

const monthList=document.getElementById('monthList');

monthData.forEach(m=>{
const monthly=m.daily*27.5;
totalCycles+=monthly;

if(m.type==='谷-峰'){
// 纯谷-峰月份，全部算谷-峰
guFengCycles+=monthly;
}else{
// 谷-峰+平-峰月份，各算27.5次
guFengCycles+=27.5;
pingFengCycles+=27.5;
}

monthList.innerHTML+=`
<div class="month-row">
<div>${m.month}</div>
<div>${m.desc}</div>
<div>${m.daily}次</div>
<div>${monthly.toFixed(1)}次</div>
</div>
`;
});

document.getElementById('totalCycles').textContent=totalCycles.toFixed(1)+'次';
document.getElementById('yearlyTotal').textContent=totalCycles.toFixed(1);

// 模式结果
document.getElementById('modeResults').innerHTML=`
<div class="mode-box">
<span style="font-size:16px">谷充→峰放</span>
<span class="count">${guFengCycles.toFixed(1)}次/年</span>
</div>
<div class="mode-box">
<span style="font-size:16px">平充→峰放</span>
<span class="count">${pingFengCycles.toFixed(1)}次/年</span>
</div>
`;
</script>
</body>
</html>
